services:
  sead_query_api:
    build:
      context: ./sead_query_api
      dockerfile: docker/Dockerfile.dev
    command: >
      sh -c "dotnet watch --project sead.query.api/sead.query.api.csproj run --no-launch-profile --no-restore"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8089
      ASPNETCORE_APPSETTINGS_FOLDER: /workspace
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
    volumes:
      - ./sead_query_api:/workspace:Z

  client:
    #The dev server's "dev" script hardcodes --allowed-hosts localhost, so it answers
    #403 "Invalid Host header" to anything the router forwards under the real domain.
    #Repeated flags append, leaving ['localhost', $DOMAIN] - both hosts stay allowed.
    #The dev server would otherwise tell the browser to reach HMR on its own listen
    #port, giving wss://$DOMAIN:80/ws - but the browser arrives over the https front
    #door on 443, so the handshake never lands. Name the public URL explicitly.
    command: npm run dev -- --port 80 --allowed-hosts ${DOMAIN} --client-web-socket-url wss://${DOMAIN}:443/ws
    #The node stage of the image: the dev server needs node, which the nginx stage lacks
    build:
      target: build
    #The checkout is mounted over the image's copy of the source, so the dev server sees
    #edits as they are saved. node_modules is kept from the image, which installed it -
    #the host needs no npm. After a dependency change, rebuild and replace the volume:
    #  podman compose build client && podman compose up -d -V client
    volumes:
      - ./sead_browser_client:/sead_browser_client:Z
      - /sead_browser_client/node_modules

  json_api_server:
    environment:
      MODE: dev
    ports:
      - "${JAS_PORT}:8484"
    #As for client: the checkout over the image's source, node_modules from the image.
    #After a dependency change: podman compose build json_api_server && podman compose up -d -V json_api_server
    volumes:
      - ./json_api_server:/json_api_server:Z
      - /json_api_server/node_modules

  #The agent's source is baked into its image, and only training/ - the whole prompt - is
  #mounted in compose.yml. Mounting src as well lets an edit to the code be tried with a
  #restart rather than a rebuild.
  sead_agent:
    volumes:
      - ./sead_agent/src:/sead_agent/src:Z

  mongo:
    ports:
      - "27017:27017"

  #The dev SAML IdP standing in for SWAMID (SimpleSAMLphp, local test accounts).
  #Reached as https://${SAML_DEV_IDP_HOST} through the router; see sead_idp/README.md.
  sead_idp:
    build:
      context: ./sead_idp
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      SAML_DEV_IDP_HOST: ${SAML_DEV_IDP_HOST:-sead-idp.local}
      SAML_DEV_IDP_ADMIN_PASSWORD: ${SAML_DEV_IDP_ADMIN_PASSWORD:-}
      SAML_DEV_IDP_SECRET_SALT: ${SAML_DEV_IDP_SECRET_SALT:-}
    volumes:
      #The IdP reads the SP's certificates from here, so the SP needs no manual registration
      - ./router/mounts/shibboleth-keys:/var/simplesamlphp/sp-keys:ro
    networks:
      - sead_network

  postgresql_mcp:
    build:
      context: ./postgres_mcp
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGUSER: ${DATABASE_READ_ONLY_USER}
      PGPASSWORD: ${DATABASE_READ_ONLY_PASSWORD}
      PGDATABASE: ${DATABASE_NAME}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
    ports:
      - "${MCP_PORT}:4000"
    networks:
      - sead_network

networks:
  sead_network:
    external: false
