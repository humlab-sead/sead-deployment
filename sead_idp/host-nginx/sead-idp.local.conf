# Host nginx server block for the dev IdP, next to the one for sead.local.
# Install (once, on the developer's machine):
#   sudo cp sead_idp/host-nginx/sead-idp.local.conf /etc/nginx/sites-available/sead-idp.local
#   sudo ln -s /etc/nginx/sites-available/sead-idp.local /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# and add sead-idp.local to the 127.0.0.1 line in /etc/hosts.
#
# Like sead.local it goes to the router (WEB_PORT, 9080 here), which hands the
# sead-idp.local host to the sead_idp container.

server {
    listen 80;
    listen [::]:80;

    server_name sead-idp.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name sead-idp.local;

    include /etc/nginx/snippets/snakeoil.conf;

    access_log /var/log/nginx/sead-idp.local.access.log;
    error_log  /var/log/nginx/sead-idp.local.error.log;

    location / {
        proxy_pass http://127.0.0.1:9080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
