# SEAD remote deployment targets.
#
# Copy this to ~/.config/sead-deployment/targets.conf on the machine you deploy
# from, then adjust ssh_host / host / user / path / identity_file as needed.
# Keep real private keys in ~/.ssh, never in this file and never in the repo.
#
# Preferred form: ssh_host points at a Host entry in ~/.ssh/config.
# Explicit fallback form: set host, user, and optional identity_file instead.

[prod]
name=browser.sead.se
role=stable production
ssh_host=sead-prod
path=/home/sead-browser/sead-deployment
domain=browser.sead.se

[super]
name=super.sead.se
role=next stable
ssh_host=sead-super
path=/home/sead-super/sead-deployment
domain=super.sead.se

[staging]
name=staging.sead.se
role=testing
ssh_host=sead-staging
path=/home/sead-staging/sead-deployment
domain=staging.sead.se

# Example without ~/.ssh/config aliases:
#
# [super]
# name=super.sead.se
# role=next stable
# host=sead-server.example.org
# user=sead-super
# identity_file=~/.ssh/sead_super_ed25519
# path=/home/sead-super/sead-deployment
# domain=super.sead.se
