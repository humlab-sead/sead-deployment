networks:
  sead_network: {}

services:
  router:
    build: ./router/docker
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - BASIC_AUTH_USER=${HTACCESS_USER}
      - BASIC_AUTH_PASS=${HTACCESS_PASSWORD}
    volumes:
      - ./router/vhost.conf:/etc/nginx/templates/default.conf.template
      - ./router/logs:/var/log/nginx
    networks:
      - sead_network

  postgresql:
    build: ./postgresql/docker
    ports:
      - ${POSTGRESQL_PORT}:5432
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DATABASE_POSTGRES_PASSWORD}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      PGDATA: /pgdata
      PGUSER: ${DATABASE_USER} #this is for sead_change_control/sqitch
      PGPASSWORD: ${DATABASE_PASSWORD} #this is for sead_change_control/sqitch
      SQITCH_USERNAME: ${DATABASE_USER} #this is for sead_change_control/sqitch
      SQITCH_PASSWORD: ${DATABASE_PASSWORD} #this is for sead_change_control/sqitch
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD} #this is for postgrest
    volumes:
      - ./postgresql/mounts/pg-data-volume:/pgdata:Z
      - ./postgresql/mounts/init-scripts:/docker-entrypoint-initdb.d
      #GADM boundary data is fetched on demand rather than vendored - 1.4 GB must never
      #reach git. Mounted so the download survives container rebuilds and re-imports.
      - ./postgresql/mounts/gadm:/var/lib/gadm:Z
      #- ./postgresql/mounts/logs:/pgdata/log
      #- ./postgresql/mounts/postgresql.conf:/pgdata/postgresql.conf
      #- ./postgresql/mounts/pg_hba.conf:/pgdata/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sead_network

  postgrest:
    depends_on:
      - postgresql
    restart: unless-stopped
    image: docker.io/postgrest/postgrest:v12.2.8
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      PGRST_DB_URI: "postgres://postgrest_anon:${DATABASE_READ_ONLY_PASSWORD}@postgresql:5432/${DATABASE_NAME}"
      PGRST_DB_SCHEMA: "public"
      PGRST_DB_ANON_ROLE: "postgrest_anon"
      PGRST_LOG_LEVEL: "info"
      PGRST_SERVER_HOST: "*"
    command: ['postgrest']
    networks:
      - sead_network

  mongo:
    image: docker.io/mongo:4.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongo --eval 'db.adminCommand(\"ping\")' -u ${MONGODB_ROOT_USER} -p ${MONGODB_ROOT_PASSWORD} --authenticationDatabase admin || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGODB_ROOT_USER
      MONGO_INITDB_ROOT_PASSWORD: $MONGODB_ROOT_PASSWORD
    volumes:
      - ./mongodb/mounts/mongodb-data-volume:/data/db:Z
      - ./mongodb/mounts/log:/var/log/mongodb
      - ./mongodb/mounts/mongod.conf:/etc/mongod.conf
    networks:
      - sead_network

  mongo-express:
    image: docker.io/mongo-express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: $MONGO_EXPRESS_USER
      ME_CONFIG_BASICAUTH_PASSWORD: $MONGO_EXPRESS_PASSWORD
      ME_CONFIG_MONGODB_ADMINUSERNAME: $MONGODB_ROOT_USER
      ME_CONFIG_MONGODB_ADMINPASSWORD: $MONGODB_ROOT_PASSWORD
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_SITE_BASEURL: "/mongo-express"
    networks:
      - sead_network

  client:
    build:
      context: ./sead_browser_client/docker
      args:
        SBC_REF: ${SBC_RELEASE}
        DOMAIN: ${DOMAIN}
        SCHEME: ${SCHEME}
        #The Dockerfile and prepare-config.js both key off MODE; SBC_BUILD is what the
        #deployment calls it in .env. Passing it under the wrong name left MODE on its
        #"dev" default, so a prod build still came up as a dev server.
        MODE: ${SBC_BUILD}
    restart: unless-stopped
    volumes:
      - ./nginx/mounts/vhosts:/etc/nginx/sites-enabled
      - ./nginx/mounts/logs:/var/log/nginx
      - ./nginx/mounts/logs/letsencrypt.log:/var/log/letsencrypt.log
      - ./nginx/mounts/logs/stats:/var/www/html/stats
      - ./certs:/etc/certs
    environment:
      DOMAIN: ${DOMAIN}
      SCHEME: ${SCHEME}
      CLIENT_RELEASE: ${CLIENT_RELEASE}
    networks:
      - sead_network

  sead_query_api:
    restart: unless-stopped
    #image: sead_query_api:2024.05.RC1
    build:
      context: ./sead_query_api/docker
      args:
        BRANCH: ${SEAD_QUERY_API_RELEASE}
    depends_on:
      - redis_cache
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:8089"
      QueryBuilderSetting__Store__Username: ${DATABASE_USER}
      QueryBuilderSetting__Store__Password: ${DATABASE_PASSWORD}
    volumes:
      - ./sead_query_api/appsettings.json:/app/appsettings.json
    #env_file: .env #Hopefully this will no longer be needed since we provide the "QueryBuilderSetting__Store__" environment variables above
    networks:
      - sead_network

  redis_cache:
    image: "docker.io/redis:5-alpine"
    command: ["redis-server", "--appendonly", "yes"]
    hostname: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - ./redis/mounts/data:/data/rw:z
      - ./redis/mounts/log:/var/log:z
    networks:
      - sead_network

  json_api_server:
    build:
      context: ./json_api_server/docker
      args:
        JAS_REF: ${JAS_RELEASE}
        MODE: "prod"
    restart: unless-stopped
    ports:
      - "${JAS_PORT}:8484"
    environment:
      API_PORT: 8484
      POSTGRES_HOST: $JAS_POSTGRES_HOST
      POSTGRES_PORT: $JAS_POSTGRES_PORT
      POSTGRES_DATABASE: $JAS_POSTGRES_DATABASE
      POSTGRES_USER: $DATABASE_READ_ONLY_USER
      POSTGRES_PASS: $DATABASE_READ_ONLY_PASSWORD
      POSTGRES_MAX_CONNECTIONS: $JAS_POSTGRES_MAX_CONNECTIONS
      MONGO_HOST: $JAS_MONGO_HOST
      MONGO_USER: $MONGODB_ROOT_USER
      MONGO_PASS: $MONGODB_ROOT_PASSWORD
      MONGO_DB: $JAS_MONGO_DB
      CACHE_STORAGE_METHOD: $JAS_CACHE_STORAGE_METHOD
      MAX_CONCURRENT_FETCHES: $JAS_MAX_CONCURRENT_FETCHES
      USE_SITE_CACHE: $JAS_USE_SITE_CACHE
      USE_TAXA_CACHE: $JAS_USE_TAXA_CACHE
      USE_ECOCODE_CACHE: $JAS_USE_ECOCODE_CACHE
      USE_QUERY_CACHE: $JAS_USE_QUERY_CACHE
      USE_SINGLE_PERSISTENT_DBCON: $JAS_USE_SINGLE_PERSISTENT_DBCON
      PROTECTED_ENDPOINTS_USER: $JAS_PROTECTED_ENDPOINTS_USER
      PROTECTED_ENDPOINTS_PASS: $JAS_PROTECTED_ENDPOINTS_PASS
      SESSION_SECRET: $JAS_SESSION_SECRET
      GOOGLE_CLIENT_ID: $JAS_GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET: $JAS_GOOGLE_CLIENT_SECRET
      GITHUB_CLIENT_ID: $JAS_GITHUB_CLIENT_ID
      GITHUB_CLIENT_SECRET: $JAS_GITHUB_CLIENT_SECRET
      ORCID_CLIENT_ID: $JAS_ORCID_CLIENT_ID
      ORCID_CLIENT_SECRET: $JAS_ORCID_CLIENT_SECRET
      ARTIFICIAL_LATENCY_MS: $JAS_ARTIFICIAL_LATENCY_MS
    depends_on:
      - mongo
      - postgresql
    networks:
      - sead_network

  sead_agent:
    build:
      context: ./sead_agent
    restart: unless-stopped
    ports:
      - "${SEAD_AGENT_PORT}:8585"
    #The LLM the agent talks to is served on the podman host itself (usually through an
    #ssh tunnel), which is not "localhost" from inside this container. It is reached at
    #llm-host, a host-only address on the seadllm0 dummy interface - see
    #sead_agent/scripts/sead-llm-host.service. Binding the tunnel there instead of
    #0.0.0.0 keeps the model off the LAN and off the VPN entirely.
    extra_hosts:
      - "llm-host:10.123.0.1"
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      SEAD_AGENT_PORT: 8585
      SEAD_AGENT_LLM_BASE_URL: ${SEAD_AGENT_LLM_BASE_URL:-}
      SEAD_AGENT_LLM_API_KEY: ${SEAD_AGENT_LLM_API_KEY:-local}
      SEAD_AGENT_LLM_MODEL: ${SEAD_AGENT_LLM_MODEL:-}
      SEAD_AGENT_THINKING_LEVEL: ${SEAD_AGENT_THINKING_LEVEL:-low}
      SEAD_AGENT_INSTRUCTIONS_FILE: ${SEAD_AGENT_INSTRUCTIONS_FILE:-}
      SEAD_AGENT_ENABLE_SANDBOX_TOOLS: ${SEAD_AGENT_ENABLE_SANDBOX_TOOLS:-false}
      SEAD_AGENT_TIMEOUT_MS: ${SEAD_AGENT_TIMEOUT_MS:-120000}
      SEAD_AGENT_MAX_INPUT_LENGTH: ${SEAD_AGENT_MAX_INPUT_LENGTH:-4000}
      SEAD_AGENT_MAX_OUTPUT_TOKENS: ${SEAD_AGENT_MAX_OUTPUT_TOKENS:-4096}
      SEAD_AGENT_RATE_LIMIT_WINDOW_MS: ${SEAD_AGENT_RATE_LIMIT_WINDOW_MS:-60000}
      SEAD_AGENT_RATE_LIMIT_MAX_REQUESTS: ${SEAD_AGENT_RATE_LIMIT_MAX_REQUESTS:-10}
      SEAD_AGENT_RATE_LIMIT_LONG_WINDOW_MS: ${SEAD_AGENT_RATE_LIMIT_LONG_WINDOW_MS:-3600000}
      SEAD_AGENT_RATE_LIMIT_LONG_MAX_REQUESTS: ${SEAD_AGENT_RATE_LIMIT_LONG_MAX_REQUESTS:-60}
      #Which X-Forwarded-For entry the per-visitor limits are counted against - it must
      #match the number of proxies in front of the agent, or the limits count nothing
      SEAD_AGENT_TRUSTED_PROXY_COUNT: ${SEAD_AGENT_TRUSTED_PROXY_COUNT:-1}
      SEAD_AGENT_ALLOWED_ORIGINS: ${SEAD_AGENT_ALLOWED_ORIGINS:-}
      SEAD_AGENT_MAX_CONCURRENT_TURNS: ${SEAD_AGENT_MAX_CONCURRENT_TURNS:-2}
      SEAD_AGENT_MAX_SESSIONS: ${SEAD_AGENT_MAX_SESSIONS:-20}
      SEAD_AGENT_SESSION_TTL_MS: ${SEAD_AGENT_SESSION_TTL_MS:-900000}
      SEAD_AGENT_CLIENT_ACTION_TIMEOUT_MS: ${SEAD_AGENT_CLIENT_ACTION_TIMEOUT_MS:-60000}
      SEAD_AGENT_MAX_CLIENT_ACTIONS: ${SEAD_AGENT_MAX_CLIENT_ACTIONS:-20}
    volumes:
      #The training documents are appended to the system prompt. Mounted so they can be
      #edited and reloaded with a restart instead of an image rebuild.
      - ./sead_agent/training:/sead_agent/training:Z
    networks:
      - sead_network

  #clearinghouse:
  #  build: ./clearinghouse/docker
  #  restart: unless-stopped
  #  ports:
  #    - "8070:8060"
  #  env_file:
  #    - ./clearinghouse/docker/.env

  maria-db:
    image: docker.io/mariadb:10
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${MARIA_DB_USER} -p${MARIA_DB_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - "./mariadb/data:/var/lib/mysql"
      #- "/etc/timezone:/etc/timezone:ro"
      #- "/etc/localtime:/etc/localtime:ro"
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIA_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIA_DB_NAME}
      MYSQL_USER: ${MARIA_DB_USER}
      MYSQL_PASSWORD: ${MARIA_DB_PASSWORD}
    networks:
      - sead_network

  matomo:
    image: docker.io/matomo:5
    restart: unless-stopped
    depends_on:
      - maria-db
    environment:
      MATOMO_ASSUME_SECURE_PROTOCOL: 1
      MATOMO_FORCE_SSL: 0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      # To allow you to view/edit Matomo configuration files:
      - "./matomo/config:/var/www/html/config:rw"
      # To allow you to easily view Matomo log files:
      - "./matomo/logs:/var/www/html/logs"
      # To allow matomo access to apache logs for imports
      - "./mounts/apache/apache/logs/apache2:/external_logs"
      #- "/etc/timezone:/etc/timezone:ro"
      #- "/etc/localtime:/etc/localtime:ro"
    networks:
      - sead_network

  
