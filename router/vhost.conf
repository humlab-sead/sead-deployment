server {
    listen 80;
    server_name ${DOMAIN};
    
    # Resolve service names at request time where needed.
    resolver ${CONTAINER_DNS_RESOLVER} valid=10s ipv6=off;

    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "no-cache, private";

    location / {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass http://client:80;
    }

    
    location = /query { return 301 /query/; }
    location /query/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        proxy_pass http://sead_query_api:8089/;
    }

    location = /jsonapi { return 301 /jsonapi/; }
    location /jsonapi/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        proxy_read_timeout 3600s;
        proxy_pass http://json_api_server:8484/;
    }

    location = /vsapi { return 301 /vsapi/; }
    location /vsapi/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        proxy_pass http://json_api_server:8484/;
    }

    location = /postgrest { return 301 /postgrest/; }
    location /postgrest/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        proxy_pass http://postgrest:3000/;
    }

    location /mongo-express {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        set $allowspace1 $1;
        proxy_pass http://mongo-express:8081;
    }

    location /matomo {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        set $allowspace1 $1;
        proxy_pass http://matomo:80;
    }

    location /ws {
        proxy_pass http://client:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;  # keep-alive for WebSocket
    }

    location /mcp {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        # Variable form avoids nginx startup failure when the dev-only upstream
        # is absent (e.g. prod mode without compose.override.yml).
        set $mcp_upstream postgresql_mcp:4000;
        proxy_pass http://$mcp_upstream;
    }

    location = /vanna { return 301 /vanna/; }
    location /vanna/ {
        auth_basic "Vanna Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        # Keep /vanna/ mapped to backend root while deferring DNS resolution.
        rewrite ^/vanna/(.*)$ /$1 break;
        set $vanna_upstream vanna:8000;
        proxy_pass http://$vanna_upstream;
    }

    location /api/vanna/ {
        auth_basic "Vanna Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        set $vanna_upstream vanna:8000;
        proxy_pass http://$vanna_upstream;
    }

    location /vanna/health {
        auth_basic "Vanna Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $vanna_upstream vanna:8000;
        proxy_pass http://$vanna_upstream/health;
    }

    location /api/vanna/health {
        auth_basic "Vanna Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $vanna_upstream vanna:8000;
        proxy_pass http://$vanna_upstream/health;
    }

