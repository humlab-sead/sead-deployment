# The router listens on plain http behind a TLS front door (host nginx on sead.local,
# the servers' front proxies online). Pass on the scheme the browser actually used, so
# backends know a request came in over https - json_api_server only sets its Secure
# session cookie when it does. A request straight to the router falls back to $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name ${DOMAIN};
    
    # Resolve service names at request time where needed.
    resolver ${CONTAINER_DNS_RESOLVER} valid=10s ipv6=off;

    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "no-cache, private";

    location / {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        set $client_upstream client:80;
        proxy_pass http://$client_upstream;
    }

    
    location = /query { return 301 /query/; }
    location /query/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        # Variable form defers DNS to request time, so the router does not cache a
        # backend's address from startup and need restarting when that backend does.
        set $query_api_upstream sead_query_api:8089;
        rewrite ^/query/(.*)$ /$1 break;
        proxy_pass http://$query_api_upstream;
    }

    location = /sead-agent { return 301 /sead-agent/; }
    location /sead-agent/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        # A turn against a local model can take a while; the agent enforces its own
        # timeout, so let nginx wait rather than cutting the connection first.
        proxy_read_timeout 300s;
        # Keep /sead-agent/ mapped to backend root while deferring DNS resolution.
        set $sead_agent_upstream sead_agent:8585;
        rewrite ^/sead-agent/(.*)$ /$1 break;
        proxy_pass http://$sead_agent_upstream;
    }

    # The web client still posts the chatbox to <dataServerAddress>/ai-assistant/message.
    # That path used to be served by json_api_server; it now belongs to sead_agent, so it
    # is peeled off here (this must stay above the /jsonapi/ location it overlaps).
    location /jsonapi/ai-assistant/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        proxy_read_timeout 300s;
        set $sead_agent_upstream sead_agent:8585;
        rewrite ^/jsonapi/ai-assistant/(.*)$ /$1 break;
        proxy_pass http://$sead_agent_upstream;
    }

    # SDF import (json_api_server /sdf/validate and /sdf/change-request): uploads of edited
    # workbooks, which run to several MB, above nginx's 1 MB default body limit. Exact
    # matches win over the /jsonapi/ prefix below. json_api_server lets in a signed-in
    # sysadmin or its protected-endpoint password, and refuses anything over
    # SDF_MAX_UPLOAD_MB itself. A proxy in front of the router needs the same body limit.
    location = /jsonapi/sdf/validate {
        client_max_body_size 64m;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        proxy_read_timeout 600s;
        set $jas_upstream json_api_server:8484;
        rewrite ^/jsonapi/(.*)$ /$1 break;
        proxy_pass http://$jas_upstream;
    }
    location = /jsonapi/sdf/change-request {
        client_max_body_size 64m;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        proxy_read_timeout 600s;
        set $jas_upstream json_api_server:8484;
        rewrite ^/jsonapi/(.*)$ /$1 break;
        proxy_pass http://$jas_upstream;
    }

    location = /jsonapi { return 301 /jsonapi/; }
    location /jsonapi/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        proxy_read_timeout 3600s;
        set $jas_upstream json_api_server:8484;
        rewrite ^/jsonapi/(.*)$ /$1 break;
        proxy_pass http://$jas_upstream;
    }

    location = /vsapi { return 301 /vsapi/; }
    location /vsapi/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        set $jas_upstream json_api_server:8484;
        rewrite ^/vsapi/(.*)$ /$1 break;
        proxy_pass http://$jas_upstream;
    }

    location = /postgrest { return 301 /postgrest/; }
    location /postgrest/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;

        set $postgrest_upstream postgrest:3000;
        rewrite ^/postgrest/(.*)$ /$1 break;
        proxy_pass http://$postgrest_upstream;
    }

    location /mongo-express {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        set $allowspace1 $1;
        set $mongo_express_upstream mongo-express:8081;
        proxy_pass http://$mongo_express_upstream;
    }

    location /matomo {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        set $allowspace1 $1;
        set $matomo_upstream matomo:80;
        proxy_pass http://$matomo_upstream;
    }

    location /ws {
        set $client_upstream client:80;
        proxy_pass http://$client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;  # keep-alive for WebSocket
    }

    location /mcp {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        # Variable form avoids nginx startup failure when the dev-only upstream
        # is absent (e.g. prod mode without compose.override.yml).
        set $mcp_upstream postgresql_mcp:4000;
        proxy_pass http://$mcp_upstream;
    }

    # ── SAML login (the router is the Service Provider) ──────────────────────
    # shibd's protocol endpoints: the ACS, the discovery return, metadata and the
    # session page. See router/shibboleth/shib_fastcgi_params for why it is told https.
    location /Shibboleth.sso {
        include /etc/sead-shibboleth/shib_fastcgi_params;
        fastcgi_pass unix:/run/shibboleth/shibresponder.sock;
    }

    # The logo the federation's discovery and consent pages show for this SP. Its URL
    # is in the SP's SWAMID registration (mdui:Logo), so it must not move.
    location = /shibboleth-sp/sead-logo.png {
        alias /etc/sead-shibboleth/sead-logo.png;
    }

    # shib_request's subrequest: "does this request have a Shibboleth session?" With
    # none, shibauthorizer answers with the redirect that starts a login.
    location = /shibauthorizer {
        internal;
        include /etc/sead-shibboleth/shib_fastcgi_params;
        fastcgi_pass unix:/run/shibboleth/shibauthorizer.sock;
    }

    # The hand-off. Once the login has succeeded, the attributes shibd extracted are
    # copied onto the request as headers and it goes to json_api_server's internal-only
    # hand-off listener, which logs the user in. The headers ARE the identity, so every
    # header shibd can produce (each id in attribute-map.xml) and the hand-off secret
    # are first cleared from what the client sent. That has to happen here: unlike
    # Apache's mod_shib, nothing in nginx strips spoofed attribute headers by itself.
    location = /auth/saml/login {
        more_clear_input_headers ${SHIB_ATTRIBUTE_HEADERS} 'Variable-*' 'Shib-*' 'REMOTE_USER' 'X-SEAD-SP-Handoff-Secret';
        shib_request /shibauthorizer;
        shib_request_use_headers on;

        proxy_set_header Host                     $host;
        proxy_set_header X-Real-IP                $remote_addr;
        proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto        $forwarded_proto;
        proxy_set_header X-SEAD-SP-Handoff-Secret "${SEAD_SP_HANDOFF_SECRET}";
        set $jas_handoff_upstream json_api_server:8485;
        proxy_pass http://$jas_handoff_upstream;
    }

    #location = /sparql {
    #    proxy_set_header Host              $host;
    #    proxy_set_header X-Real-IP         $remote_addr;
    #    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    #    proxy_hide_header Access-Control-Allow-Origin;
    #    add_header Access-Control-Allow-Origin * always;

    #    proxy_pass http://ontop:80/sparql;
    #}

    #location /sas/ {
    #    proxy_set_header   Host              $host;
    #    proxy_set_header   X-Real-IP         $remote_addr;
    #    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #    proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    #    proxy_hide_header  Access-Control-Allow-Origin;
    #    add_header         Access-Control-Allow-Origin * always;

    #    proxy_pass http://sead-authority-service:8000/;
    #}
}

server {
    listen 80;
    server_name stats.${DOMAIN};

    resolver ${CONTAINER_DNS_RESOLVER} valid=10s ipv6=off;

    location / {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        set $matomo_upstream matomo:80;
        proxy_pass http://$matomo_upstream;
    }
}

# The dev IdP (sead_idp, SimpleSAMLphp; compose.override.yml only). It is a separate
# site from ${DOMAIN} on purpose, so the IdP's POST back is cross-site in dev just as a
# university's is online. On super and browser this is an inert block for a hostname
# nobody resolves, and the variable upstream keeps nginx from failing without sead_idp.
server {
    listen 80;
    server_name ${SAML_DEV_IDP_HOST};

    resolver ${CONTAINER_DNS_RESOLVER} valid=10s ipv6=off;

    location / {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        set $sead_idp_upstream sead_idp:80;
        proxy_pass http://$sead_idp_upstream;
    }
}

