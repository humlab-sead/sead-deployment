;nginx, shibd and shibd's two FastCGI programs, each restarted if it dies. Everything
;logs to the container's output (podman logs <router>), except nginx's access and error
;logs, which stay in router/logs.
;
;shibd and the FastCGI programs only start when the entrypoint found a Shibboleth config
;and SP keys (SHIBD_AUTOSTART). Without them nginx still serves everything but SAML login.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:shibd]
command=/usr/sbin/shibd -F -f -c /etc/shibboleth/shibboleth2.xml -p /run/shibboleth/shibd.pid -w 30
priority=20
autostart=%(ENV_SHIBD_AUTOSTART)s
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

;The sockets belong to www-data, so only nginx's workers can talk to them
[program:shibauthorizer]
command=/usr/bin/spawn-fcgi -n -s /run/shibboleth/shibauthorizer.sock -M 0600 -U www-data -G www-data -- /usr/local/lib/shibboleth/shibauthorizer
priority=30
autostart=%(ENV_SHIBD_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:shibresponder]
command=/usr/bin/spawn-fcgi -n -s /run/shibboleth/shibresponder.sock -M 0600 -U www-data -G www-data -- /usr/local/lib/shibboleth/shibresponder
priority=30
autostart=%(ENV_SHIBD_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
